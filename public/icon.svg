<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crestBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <!-- Outer Ring Shield -->
  <path d="M256 48 L416 112 C416 288 320 400 256 448 C192 400 96 288 96 112 Z" fill="#0b1329" stroke="url(#shieldGold)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Crest -->
  <path d="M256 78 L386 130 C386 270 306 364 256 406 C206 364 126 270 126 130 Z" fill="url(#crestBlue)" opacity="0.85"/>

  <!-- Star of Security -->
  <polygon points="256,150 268,188 308,188 276,212 288,250 256,226 224,250 236,212 204,188 244,188" fill="#fbbf24"/>

  <!-- Digital Circuit Pattern / Cybercrime emblem -->
  <path d="M200 290 H312 M256 290 V360 M220 330 H292" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="290" r="8" fill="#60a5fa"/>
  <circle cx="312" cy="290" r="8" fill="#60a5fa"/>
  <circle cx="256" cy="360" r="8" fill="#fbbf24"/>
  <circle cx="220" cy="330" r="6" fill="#ffffff"/>
  <circle cx="292" cy="330" r="6" fill="#ffffff"/>

  <!-- Institutional Banner Text -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#93c5fd" letter-spacing="4">SIS.POL.</text>
</svg>
